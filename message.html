<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6f8ff, #eef4ff);
            color: #243447;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .message-board {
            width: min(100%, 640px);
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(36, 52, 71, 0.12);
            padding: 28px;
        }
        h3 { margin: 0 0 20px; font-size: 24px; }
        label { font-weight: 600; color: #2d3748; display: block; margin-bottom: 8px; }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
            margin-bottom: 14px;
        }
        input:focus, textarea:focus {
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.15);
        }
        textarea { resize: vertical; }
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }
        .button-group button {
            flex: 1;
        }
        button {
            border: none;
            border-radius: 999px;
            background: #2b6cb0;
            color: white;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: #225a8d; }
    </style>
</head>
<body>
    <!-- 留言表单 -->
    <div class="message-board">
    <h3>给我留言</h3>
    <!-- 把下面your@shturl.替换成你自己接收留言的邮箱 -->
    <form action="https://formsubmit.co/2752318348@qq.com" method="POST">
        <input type="hidden" name="_next" value="https://yohou.site/thank-you.html">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_subject" value="网站收到新留言！">

        <div>
            <label>昵称：</label>
            <input type="text" name="昵称" required>
        </div>
        <div>
            <label>留言内容：</label>
            <textarea name="留言内容" rows="5" required></textarea>
        </div>
        <div class="button-group">
            <button type="submit">提交留言</button>
            <button type="reset">重置</button>
            <button type="button" onclick="window.location.href='index.html'">返回主页</button>
        </div>
    </form>
    </div>
 

</body>
</html>

<!-- 统一访问计数徽章脚本 -->
<div id="site-stats" class="site-stats" aria-hidden="true" style="display:none;position:fixed;right:16px;bottom:16px;z-index:10000;background:rgba(0,0,0,.75);color:#fff;padding:8px 12px;border-radius:20px;font-weight:700;font-size:13px;">
    访问量：<span id="visit-count">—</span>
</div>
<script>
    (function(){
        const badge = document.getElementById('site-stats');
        const countEl = document.getElementById('visit-count');
        const api = '/api/visits';
        fetch(api, {method:'POST'}).then(r=>r.json()).then(j=>{ countEl.textContent = j.count; badge.style.display='block'; badge.setAttribute('aria-hidden','false'); }).catch(()=>{});
    })();
</script>
