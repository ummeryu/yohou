<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6f8ff, #eef4ff);
            color: #243447;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .message-board {
            width: min(100%, 640px);
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(36, 52, 71, 0.12);
            padding: 28px;
        }
        h3 { margin: 0 0 20px; font-size: 24px; }
        label { font-weight: 600; color: #2d3748; display: block; margin-bottom: 8px; }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
            margin-bottom: 14px;
        }
        input:focus, textarea:focus {
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.15);
        }
        textarea { resize: vertical; }
        button {
            border: none;
            border-radius: 999px;
            background: #2b6cb0;
            color: white;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: #225a8d; }
    </style>
</head>
<body>
    <!-- 留言表单 -->
    <div class="message-board">
    <h3>给我留言</h3>
    <!-- 把下面your@shturl.替换成你自己接收留言的邮箱 -->
    <form action="https://formsubmit.co/2752318348@qq.com" method="POST">
        <input type="hidden" name="_next" value="./thank-you.html">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_subject" value="网站收到新留言！">

        <div>
            <label>昵称：</label>
            <input type="text" name="昵称" required>
        </div>
        <div>
            <label>留言内容：</label>
            <textarea name="留言内容" rows="5" required></textarea>
        </div>
        <br>
        <button type="submit">提交留言</button>
    </form>
    </div>
</body>
</html>
