<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6f8ff, #eef4ff);
            color: #243447;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: min(100%, 640px);
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(36, 52, 71, 0.12);
            padding: 28px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }
        .topbar a {
            text-decoration: none;
            color: #2b6cb0;
            font-weight: 600;
        }
        h1 { margin: 0; font-size: 28px; }
        p { margin: 0 0 18px; line-height: 1.6; color: #4a5568; }
        form { display: grid; gap: 14px; }
        label { font-weight: 600; color: #2d3748; }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus, textarea:focus {
            border-color: #4c6ef5;
            box-shadow: 0 0 0 3px rgba(76, 110, 245, 0.15);
        }
        textarea { min-height: 120px; resize: vertical; }
        button {
            border: none;
            border-radius: 999px;
            background: #2b6cb0;
            color: white;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: #225a8d; }
        .notice {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #f0fff4;
            color: #2f855a;
            display: none;
        }
        .notice.show { display: block; }
    </style>
</head>

    <!-- 留言表单 -->
<div class="message-board">
  <h3>给我留言</h3>
  <!-- 把下面your@shturl.替换成你自己接收留言的邮箱 -->
  <form action="https://formsubmit.co/2752318348@qq.com" method="POST">
    <!-- 防垃圾邮件配置 -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_subject" value="网站收到新留言！">

    <div>
      <label>昵称：</label>
      <input type="text" name="昵称" required>
    </div>
    <div>
      <label>留言内容：</label>
      <textarea name="留言内容" rows="5" required></textarea>
    </div>
    <br>
    <button type="submit">提交留言</button>
  </form>
</div>
