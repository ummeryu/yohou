<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一个很厉害的网站</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6f8ff, #eef4ff);
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #243447;
            margin-bottom: 40px;
        }
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        a {
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(36, 52, 71, 0.1);
            text-decoration: none;
            color: #2b6cb0;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
        }
        a:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(36, 52, 71, 0.15);
            background: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>一个很厉害的网站</h1>
        <div class="link-grid">
            <a href="dcy.html">进入 dcy 的页面</a>
            <a href="zhy.html">进入 zhy 的页面</a>
            <a href="message.html">进入留言板</a>
        </div>
    </div>
</body>
</html>
